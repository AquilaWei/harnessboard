name: CI

# Runs only when a version tag is pushed, so a release is never published on red.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Corepack provides pnpm only after this step; the packageManager field would
          # otherwise make setup-node look for pnpm to cache and fail.
          package-manager-cache: false
      # --force: the Windows runner already ships a yarn shim that corepack would collide with.
      # Installs the pnpm version pinned in package.json's packageManager field.
      - run: npm install --global --force corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Gemini's own policy engine, outside the workspace, for gemini-policy.test.ts.
      - run: npm install --no-save --prefix "$RUNNER_TEMP/gemini" @google/gemini-cli-core@0.62.0
        shell: bash
      # The tests drive a fake claude CLI (packages/core/test/fixtures), so no account is needed.
      - run: pnpm test
        env:
          HARNESSBOARD_TEST_GEMINI_CORE: ${{ runner.temp }}/gemini/node_modules/@google/gemini-cli-core

  # Installers for the desktop app, built only once every test job passed.
  desktop:
    name: desktop / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global --force corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # rpmbuild, for the .rpm installer.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm --filter @harnessboard/desktop dist
        env:
          # Not signed yet; keeps electron-builder from looking for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.rpm
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
          if-no-files-found: error

  # The Android app, checked like `pnpm android:check` locally and signed with the release key
  # from the repo's secrets (README: Android app > Signing key).
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global --force corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      # The Gradle toolchain the app and buildSrc compile with (android/app/build.gradle.kts).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Accepts the SDK licences and sets ANDROID_HOME; AGP needs platform 37.
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0
      - run: pnpm android:check
      - name: Signed release APK
        working-directory: android
        env:
          HB_ANDROID_KEYSTORE: ${{ secrets.HB_ANDROID_KEYSTORE }}
          HB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HB_ANDROID_KEYSTORE_PASSWORD }}
          HB_ANDROID_KEY_ALIAS: ${{ secrets.HB_ANDROID_KEY_ALIAS }}
          HB_ANDROID_KEY_PASSWORD: ${{ secrets.HB_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --console=plain assembleRelease
      # Without the secrets Gradle names the APK app-release-unsigned.apk, which phones refuse
      # to install, so the release stops here instead of shipping it.
      - name: Name the APK after the version
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No signed APK: set the HB_ANDROID_* secrets (README)"; exit 1; }
          version="$(node -p "require('./packages/server/package.json').version")"
          mkdir apk && cp "$apk" "apk/harnessboard-$version.apk"
          # The public certificate fingerprint, for the androidAppFingerprints default.
          keytool -printcert -jarfile "apk/harnessboard-$version.apk" | grep 'SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/*.apk
          if-no-files-found: error

  # A draft release with the installers, the APK, their SHA256 sums and the CHANGELOG section
  # of the tag. Publishing the draft is left to a person.
  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
