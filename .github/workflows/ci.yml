name: CI

# Runs only when a version tag is pushed, so a release is never published on red.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Corepack provides pnpm only after this step; the packageManager field would
          # otherwise make setup-node look for pnpm to cache and fail.
          package-manager-cache: false
      # --force: the Windows runner already ships a yarn shim that corepack would collide with.
      # Installs the pnpm version pinned in package.json's packageManager field.
      - run: npm install --global --force corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # The tests drive a fake claude CLI (packages/core/test/fixtures), so no account is needed.
      - run: pnpm test
